<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Game Menu</title>
<style>
:root{
  --bg:#0f1117; --panel:#161a24; --line:#272e40; --text:#e8ecf5; --dim:#8b93a7; --accent:#3fd8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1100px 700px at 50% -10%, #1c2233 0%, var(--bg) 60%) fixed, var(--bg);
  color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;
}
h1{
  font-size:34px;letter-spacing:10px;font-weight:800;color:var(--accent);
  margin-bottom:8px;
}
.subtitle{color:var(--dim);font-size:14px;margin-bottom:36px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;width:min(720px,90vw);
}
.card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:28px 18px;text-decoration:none;color:var(--text);
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  cursor:pointer;
}
.card:hover,.card:focus-visible{
  transform:translateY(-4px);
  border-color:var(--accent);
  box-shadow:0 8px 24px rgba(63,216,240,.15);
  outline:none;
}
.card .icon{font-size:42px;line-height:1}
.card .name{font-size:18px;font-weight:700;letter-spacing:1px}
.card .desc{font-size:12px;color:var(--dim);text-align:center}
.card.disabled{opacity:.45;pointer-events:none}
.card.disabled .name{color:var(--dim)}
footer{margin-top:40px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<h1>GAMES</h1>
<div class="subtitle">Select a game to play</div>
<div class="grid" id="grid"></div>
<footer>Use &larr; &rarr; &uarr; &darr; to navigate &bull; Enter to launch</footer>

<script>
(() => {
'use strict';

// ---------- game list ----------
// To add a game: create the game in games/<name>.html and add an entry here.
// Set href to null to show a disabled "coming soon" card.
const GAMES = [
  { name: 'Tetris',   icon: '🧱', desc: 'Stack the blocks, clear the lines', href: 'games/tetris.html' },
  { name: 'Pong',     icon: '🏓', desc: 'Classic paddle duel vs the AI',     href: 'games/pong.html' },
  { name: 'Breakout', icon: '🎯', desc: 'Smash the bricks, keep the ball up', href: 'games/breakout.html' },
  // { name: 'Snake',    icon: '🐍', desc: 'Eat, grow, don\'t crash',        href: 'games/snake.html' },
];

// ---------- render ----------
const grid = document.getElementById('grid');
const cards = GAMES.map(g => {
  const a = document.createElement('a');
  a.className = 'card' + (g.href ? '' : ' disabled');
  a.href = g.href || '#';
  if (!g.href) a.setAttribute('aria-disabled', 'true');
  a.innerHTML =
    '<div class="icon">' + g.icon + '</div>' +
    '<div class="name">' + g.name + '</div>' +
    '<div class="desc">' + g.desc + '</div>';
  grid.appendChild(a);
  return a;
});

// ---------- keyboard navigation ----------
let focusIdx = -1;
const enabled = cards.filter(c => !c.classList.contains('disabled'));

function setFocus(i) {
  focusIdx = i;
  cards.forEach((c, j) => c.style.outline = j === i ? '2px solid var(--accent)' : 'none');
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowRight':
    case 'ArrowDown':
    case 'ArrowLeft':
    case 'ArrowUp': {
      e.preventDefault();
      if (!enabled.length) return;
      const delta = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
      const cur = focusIdx === -1 ? -1 : focusIdx;
      const next = ((cur + delta) % enabled.length + enabled.length) % enabled.length;
      setFocus(next);
      break;
    }
    case 'Enter':
      if (focusIdx !== -1) enabled[focusIdx].click();
      break;
  }
});

cards.forEach(c => c.addEventListener('focus', () => {
  const i = enabled.indexOf(c);
  if (i !== -1) focusIdx = i;
}));
})();
</script>
</body>
</html>
